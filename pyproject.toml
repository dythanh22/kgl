[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kgl"
version = "0.1.0"
description = "Use a Kaggle GPU notebook runtime from your own machine (exec, files, interactive inference)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []          # stdlib only (own minimal WebSocket client)
license = { text = "MIT" }

[project.optional-dependencies]
desktop = ["kagglesdk==0.1.38; python_version >= '3.11'"]

[project.scripts]
kgl = "kgl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
"kgl.remote" = ["snippets/*.py"]
