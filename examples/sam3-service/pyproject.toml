[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sam3-service"
version = "0.1.0"
description = "Dịch vụ suy luận SAM 3 (ảnh) cho tích hợp CVAT: ảnh + prompt -> mask/box/score"
readme = "README.md"
requires-python = ">=3.12"
# Torch/torchvision và gói `sam3` KHÔNG nằm ở đây: Torch phải khớp driver/CUDA
# của máy B, còn `sam3` được cài từ git theo SHA đã pin (xem Dockerfile).
# Chốt phiên bản chính xác (lockfile) sau khi thử trên GPU thực tế.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pillow>=10.3",
    # Khớp ràng buộc của SAM3 (numpy>=1.26,<2).
    "numpy>=1.26,<2",
    "packaging>=23",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sam3_service = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Test GPU mặc định bị bỏ qua; chạy bằng: pytest -m gpu
addopts = "-m 'not gpu'"
markers = ["gpu: cần GPU thật + checkpoint SAM3 (đặt SAM3_TEST_CHECKPOINT)"]

[tool.ruff]
line-length = 100
target-version = "py312"
