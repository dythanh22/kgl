<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kgl workspace chat</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f3f6f6;
    --surface: #ffffff;
    --surface-subtle: #f7fafa;
    --surface-hover: #ebf1f1;
    --border: #d8e2e2;
    --border-strong: #b6c5c7;
    --text: #18272c;
    --text-secondary: #4c6268;
    --text-muted: #6c8086;
    --accent: #0f766e;
    --accent-hover: #0c625b;
    --accent-soft: #e6f4f2;
    --accent-border: #b9dfd9;
    --user-bg: #e7f4f2;
    --user-border: #c5e3de;
    --code-bg: #f0f4f5;
    --code-head: #e4ebeb;
    --warn: #9a4d00;
    --warn-bg: #fffaeb;
    --warn-border: #f3d285;
    --danger: #b42318;
    --danger-bg: #fef3f2;
    --danger-border: #f7c2be;
    --ok: #0f7b55;
    --shadow-sm: 0 1px 2px rgba(15, 35, 40, .06);
    --shadow-md: 0 6px 20px rgba(15, 35, 40, .09);
    --radius: .75rem;
    --font-sans: "Inter", "Source Sans 3", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --font-mono: "IBM Plex Mono", "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font: 15px/1.55 var(--font-sans);
    color: var(--text);
    background: var(--bg);
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #101618;
    --surface: #161e21;
    --surface-subtle: #1c262a;
    --surface-hover: #243136;
    --border: #2a373c;
    --border-strong: #3e5057;
    --text: #e7eff1;
    --text-secondary: #9fb3b9;
    --text-muted: #7b9097;
    --accent: #14968b;
    --accent-hover: #19afa2;
    --accent-soft: #152e2d;
    --accent-border: #245652;
    --user-bg: #173534;
    --user-border: #24504e;
    --code-bg: #11181b;
    --code-head: #1c272b;
    --warn: #f7b955;
    --warn-bg: #2a2011;
    --warn-border: #5c441c;
    --danger: #f97066;
    --danger-bg: #2d1618;
    --danger-border: #5c2529;
    --ok: #34d399;
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, .25);
    --shadow-md: 0 8px 24px rgba(0, 0, 0, .35);
  }

  * { box-sizing: border-box }
  [hidden] { display: none !important }
  html, body { height: 100%; margin: 0 }
  body { display: flex; flex-direction: column; overflow: hidden; background: var(--bg); color: var(--text) }
  h1, h2, h3, h4, p { margin: 0 }
  input, textarea, button, select { font: inherit }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }

  /* Top bar */
  header {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: .75rem;
    flex-wrap: wrap;
    padding: .6rem clamp(.75rem, 2vw, 1.5rem);
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    z-index: 10;
  }
  .brand, .connection { display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; min-width: 0 }
  .brand-meta { display: flex; align-items: baseline; gap: .55rem; flex-wrap: wrap; min-width: 0 }
  h1 { font-size: 1.08rem; font-weight: 700; letter-spacing: -.01em; white-space: nowrap }
  #model, #session-time {
    font-size: .78rem;
    color: var(--text-secondary);
    background: var(--surface-subtle);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: .12rem .55rem;
    overflow-wrap: anywhere;
  }
  #session-time[data-low] {
    color: var(--warn);
    background: var(--warn-bg);
    border-color: var(--warn-border);
    font-weight: 600;
  }

  #status {
    display: inline-flex;
    align-items: center;
    gap: .4rem;
    font-size: .82rem;
    color: var(--text-secondary);
    max-width: 34rem;
  }
  #status::before {
    content: "";
    width: .52rem;
    height: .52rem;
    border-radius: 50%;
    flex: 0 0 auto;
    background: var(--text-muted);
  }
  #status[data-state="ready"]::before { background: var(--ok) }
  #status[data-state="busy"]::before { background: var(--warn); animation: pulse 1.2s ease-in-out infinite }
  #status[data-state="error"] { color: var(--danger) }
  #status[data-state="error"]::before { background: var(--danger) }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1) }
    50% { opacity: .45; transform: scale(.85) }
  }

  /* Buttons */
  button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: .35rem;
    border: 1px solid transparent;
    border-radius: .5rem;
    padding: .42rem .8rem;
    background: var(--accent);
    color: #fff;
    font-size: .86rem;
    font-weight: 600;
    cursor: pointer;
    transition: background .14s ease, border-color .14s ease, color .14s ease, opacity .14s ease;
    white-space: nowrap;
  }
  button:hover:not(:disabled) { background: var(--accent-hover) }
  button:disabled { opacity: .48; cursor: not-allowed }
  .btn-secondary {
    background: var(--surface);
    color: var(--text);
    border-color: var(--border);
  }
  .btn-secondary:hover:not(:disabled) { background: var(--surface-hover); border-color: var(--border-strong) }
  .btn-ghost {
    background: transparent;
    color: var(--text-secondary);
    border-color: transparent;
    padding: .34rem .55rem;
  }
  .btn-ghost:hover:not(:disabled) { background: var(--surface-hover); color: var(--text) }
  .btn-danger {
    background: transparent;
    color: var(--danger);
    border-color: transparent;
    padding: .34rem .55rem;
  }
  .btn-danger:hover:not(:disabled) { background: var(--danger-bg); border-color: var(--danger-border) }
  .btn-stop {
    background: var(--danger);
    color: #fff;
  }
  .btn-stop:hover:not(:disabled) { background: #911c13 }
  .btn-icon {
    width: 2rem;
    height: 2rem;
    padding: 0;
    font-size: 1rem;
  }

  /* Auth banner */
  #auth {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: .65rem;
    flex-wrap: wrap;
    padding: .65rem clamp(.75rem, 2vw, 1.5rem);
    background: var(--warn-bg);
    border-bottom: 1px solid var(--warn-border);
  }
  #auth label { font-size: .84rem; font-weight: 600; color: var(--warn) }
  #key { width: min(22rem, 100%); padding: .36rem .6rem }

  /* Workspace shell */
  main { flex: 1; min-height: 0; display: flex; flex-direction: column }
  .workspace {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: 17.5rem minmax(0, 1fr);
    background: var(--surface);
  }
  .workspace:has(aside[hidden]) { grid-template-columns: minmax(0, 1fr) }

  /* Sidebar */
  aside {
    display: flex;
    flex-direction: column;
    min-height: 0;
    background: var(--bg);
    border-right: 1px solid var(--border);
    padding: .85rem;
    gap: .6rem;
  }
  .sidebar-top { display: flex; align-items: center; justify-content: space-between; gap: .5rem }
  aside h2 { font-size: .82rem; text-transform: uppercase; letter-spacing: .05em; color: var(--text-muted) }
  #new-chat { width: 100%; justify-content: center; padding: .52rem .85rem }
  #history-search {
    width: 100%;
    padding: .42rem .65rem;
    font-size: .86rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: .5rem;
    color: var(--text);
  }
  #history-search:focus { border-color: var(--accent) }
  #history {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: .2rem;
    padding-right: .15rem;
  }
  #history button {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: .5rem;
    text-align: left;
    background: transparent;
    color: var(--text-secondary);
    border-radius: .5rem;
    padding: .5rem .65rem;
    font-weight: 500;
    font-size: .87rem;
  }
  #history button:hover:not(:disabled) { background: var(--surface-hover); color: var(--text) }
  #history [aria-current=true] {
    background: var(--surface);
    color: var(--text);
    font-weight: 600;
    border-color: var(--border);
    box-shadow: inset 3px 0 var(--accent), var(--shadow-sm);
  }
  .history-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0 }
  .history-count {
    flex: 0 0 auto;
    font-size: .72rem;
    color: var(--text-muted);
    background: var(--surface-subtle);
    padding: .05rem .38rem;
    border-radius: 999px;
    font-variant-numeric: tabular-nums;
  }
  .history-empty {
    font-size: .83rem;
    color: var(--text-muted);
    text-align: center;
    padding: 1.5rem .5rem;
  }
  .sidebar-footer {
    flex: 0 0 auto;
    padding-top: .55rem;
    border-top: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: .4rem;
  }
  .history-actions { display: grid; grid-template-columns: 1fr 1fr; gap: .4rem }
  #history-status { font-size: .78rem; color: var(--text-secondary); line-height: 1.4 }

  /* Main chat panel */
  .panel {
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
    height: 100%;
    background: var(--surface);
    position: relative;
  }
  .thread-head {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: .75rem;
    padding: .65rem clamp(1rem, 3vw, 2rem);
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }
  #thread-title {
    font-size: .96rem;
    font-weight: 650;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    min-width: 0;
  }
  .thread-actions { display: flex; align-items: center; gap: .25rem; flex: 0 0 auto }
  #toggle-system[aria-expanded="true"], #toggle-system[data-active="true"] {
    color: var(--accent);
    background: var(--accent-soft);
  }

  /* Optional system prompt bar */
  #system-bar {
    flex: 0 0 auto;
    padding: .75rem clamp(1rem, 3vw, 2rem);
    background: var(--surface-subtle);
    border-bottom: 1px solid var(--border);
  }
  .system-inner { max-width: 52rem; margin: 0 auto; display: flex; flex-direction: column; gap: .45rem }
  .system-head { display: flex; align-items: center; justify-content: space-between; gap: .5rem; flex-wrap: wrap }
  .system-head label { font-size: .8rem; font-weight: 650; color: var(--text-secondary) }
  .preset-chips { display: flex; align-items: center; gap: .35rem; flex-wrap: wrap }
  .chip {
    font-size: .75rem;
    font-weight: 500;
    padding: .18rem .55rem;
    border-radius: 999px;
    background: var(--surface);
    color: var(--text-secondary);
    border: 1px solid var(--border);
  }
  .chip:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); background: var(--accent-soft) }
  #system-prompt {
    width: 100%;
    min-height: 2.8rem;
    max-height: 8rem;
    resize: vertical;
    padding: .45rem .65rem;
    font-size: .86rem;
    border: 1px solid var(--border);
    border-radius: .5rem;
    background: var(--surface);
    color: var(--text);
  }

  /* Transcript area */
  .transcript-wrap {
    flex: 1;
    min-height: 0;
    position: relative;
    display: flex;
    flex-direction: column;
  }
  #transcript {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 1.4rem clamp(1rem, 4vw, 3rem) 2rem;
    scrollbar-gutter: stable;
  }
  #transcript:empty { display: none }

  /* Empty state with daily work starters */
  #empty-state {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem clamp(1rem, 4vw, 2.5rem);
    text-align: center;
  }
  .empty-card { max-width: 44rem; width: 100% }
  .empty-card h3 { font-size: 1.35rem; font-weight: 700; letter-spacing: -.015em; margin-bottom: .4rem }
  .empty-card > p { color: var(--text-secondary); font-size: .93rem; margin-bottom: 1.5rem }
  .starters {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: .75rem;
    text-align: left;
  }
  .starter {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: .25rem;
    padding: .9rem 1rem;
    background: var(--surface-subtle);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    white-space: normal;
    text-align: left;
    font-weight: 500;
  }
  .starter:hover:not(:disabled) {
    background: var(--accent-soft);
    border-color: var(--accent-border);
  }
  .starter strong { font-size: .9rem; color: var(--text) }
  .starter span { font-size: .81rem; color: var(--text-secondary); line-height: 1.4; font-weight: 400 }

  #scroll-bottom {
    position: absolute;
    right: 1.5rem;
    bottom: 1rem;
    border-radius: 999px;
    padding: .35rem .75rem;
    font-size: .8rem;
    box-shadow: var(--shadow-md);
    z-index: 5;
  }

  /* Messages */
  article {
    margin: 0 auto 1.4rem;
    max-width: 52rem;
    overflow-wrap: anywhere;
  }
  .msg-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: .5rem;
    margin-bottom: .3rem;
  }
  article h2 {
    font-size: .78rem;
    font-weight: 700;
    letter-spacing: .02em;
    text-transform: uppercase;
    color: var(--text-muted);
  }
  article.assistant h2 { color: var(--accent) }
  article.assistant[data-partial="true"] h2 { color: var(--warn) }
  article.user {
    background: var(--user-bg);
    border: 1px solid var(--user-border);
    padding: .75rem 1.05rem;
    border-radius: 1rem 1rem .25rem 1rem;
    width: fit-content;
    max-width: min(86%, 44rem);
    margin-left: auto;
    margin-right: max(0px, calc((100% - 52rem) / 2));
  }
  article.user h2 { color: var(--text-secondary) }
  article p, pre, #output { white-space: pre-wrap }
  article p { line-height: 1.65 }
  .answer > * + * { margin-top: .65rem }
  .answer ul, .answer ol { margin: .4rem 0; padding-inline-start: 1.5rem }
  .answer li { margin: .25rem 0; line-height: 1.6 }
  .answer li.task-item { list-style: none; margin-inline-start: -1.1rem; display: flex; align-items: baseline; gap: .45rem }
  .answer li.task-item input { margin: 0; accent-color: var(--accent) }
  .answer h3, .answer h4, .answer h5, .answer h6 { margin: .9rem 0 .3rem; line-height: 1.35 }
  .answer h3 { font-size: 1.1rem }
  .answer h4 { font-size: 1rem }
  .answer blockquote {
    margin: .5rem 0;
    padding: .4rem .9rem;
    border-left: 3px solid var(--accent);
    background: var(--surface-subtle);
    color: var(--text-secondary);
    border-radius: 0 .4rem .4rem 0;
  }
  .answer hr { border: 0; border-top: 1px solid var(--border); margin: .9rem 0 }
  .answer code {
    font-family: var(--font-mono);
    font-size: .88em;
    background: var(--code-bg);
    padding: .1rem .32rem;
    border-radius: .3rem;
  }
  .code-block {
    border: 1px solid var(--border);
    border-radius: .55rem;
    overflow: hidden;
    background: var(--code-bg);
  }
  .code-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: .3rem .65rem;
    background: var(--code-head);
    border-bottom: 1px solid var(--border);
    font-size: .76rem;
    color: var(--text-secondary);
    font-family: var(--font-mono);
  }
  pre {
    margin: 0;
    font: .86rem/1.55 var(--font-mono);
    background: transparent;
    padding: .8rem .9rem;
    overflow-x: auto;
  }
  pre code { background: transparent; padding: 0; font-size: inherit }
  .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: .5rem }
  .answer table { width: 100%; border-collapse: collapse; font-size: .88rem }
  .answer th, .answer td { padding: .48rem .7rem; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top }
  .answer th { background: var(--surface-subtle); font-weight: 650 }
  .answer tr:last-child td { border-bottom: 0 }

  .copy {
    font-size: .75rem;
    font-weight: 600;
    padding: .18rem .5rem;
    color: var(--text-secondary);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: .35rem;
  }
  .copy:hover:not(:disabled) { background: var(--surface-hover); color: var(--text) }

  /* Reasoning collapsible */
  details.reasoning {
    margin: .35rem 0 .65rem;
    border: 1px solid var(--border);
    border-radius: .55rem;
    background: var(--surface-subtle);
    padding: .4rem .75rem;
  }
  details.reasoning summary {
    cursor: pointer;
    font-size: .82rem;
    font-weight: 600;
    color: var(--text-secondary);
    user-select: none;
  }
  details.reasoning p {
    margin-top: .5rem;
    padding-top: .5rem;
    border-top: 1px solid var(--border);
    font-size: .86rem;
    color: var(--text-secondary);
    line-height: 1.55;
  }

  .thinking-indicator {
    display: inline-flex;
    align-items: center;
    gap: .4rem;
    font-size: .86rem;
    color: var(--text-muted);
    padding: .25rem 0;
  }
  .thinking-indicator::before {
    content: "";
    width: .5rem;
    height: .5rem;
    border-radius: 50%;
    background: var(--accent);
    animation: pulse 1.1s ease-in-out infinite;
  }

  /* Vision / predictions panel */
  #result {
    flex: 1;
    overflow-y: auto;
    padding: 1.5rem clamp(1rem, 4vw, 3rem);
    max-width: 48rem;
    width: 100%;
    margin: 0 auto;
  }
  #result h2 { font-size: 1rem; margin-bottom: .75rem }
  #output {
    font-family: var(--font-mono);
    font-size: .92rem;
    background: var(--surface-subtle);
    border: 1px solid var(--border);
    border-radius: .6rem;
    padding: .9rem 1rem;
  }
  #vision-preview {
    max-height: 12rem;
    max-width: 100%;
    border-radius: .5rem;
    border: 1px solid var(--border);
    margin-top: .6rem;
    display: block;
  }

  /* Composer */
  form {
    flex: 0 0 auto;
    border-top: 1px solid var(--border);
    background: var(--surface);
    padding: .8rem clamp(1rem, 3vw, 2rem) .85rem;
  }
  .composer-inner { max-width: 52rem; margin: 0 auto; display: flex; flex-direction: column; gap: .55rem }
  .composer-box {
    border: 1px solid var(--border-strong);
    border-radius: .85rem;
    background: var(--surface-subtle);
    padding: .55rem .7rem .5rem;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  .composer-box:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
    background: var(--surface);
  }
  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }
  #prompt {
    width: 100%;
    min-height: 3.1rem;
    max-height: 14rem;
    resize: none;
    border: 0;
    background: transparent;
    color: var(--text);
    padding: .15rem .1rem;
    line-height: 1.5;
    outline: none;
  }
  .composer-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: .5rem;
    flex-wrap: wrap;
    padding-top: .4rem;
    border-top: 1px solid var(--border);
    margin-top: .3rem;
  }
  .shortcut-hint { font-size: .75rem; color: var(--text-muted) }
  .submit-group { display: flex; align-items: center; gap: .4rem; margin-left: auto }

  .actions {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: .65rem;
    flex-wrap: wrap;
  }
  #generation {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: .5rem .8rem;
    font-size: .8rem;
    color: var(--text-secondary);
  }
  .field-inline { display: inline-flex; align-items: center; gap: .38rem }
  .field-inline label { font-weight: 600; font-size: .78rem; color: var(--text-secondary) }
  input, select {
    border: 1px solid var(--border);
    border-radius: .45rem;
    padding: .28rem .5rem;
    color: var(--text);
    background: var(--surface);
    font-size: .82rem;
  }
  #max-tokens { width: 5.5rem }
  #vision { display: flex; flex-direction: column; gap: .4rem }
  #vision label { font-weight: 600; font-size: .86rem }

  .metrics-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: .6rem 1.2rem;
    flex-wrap: wrap;
  }
  .metrics {
    font-size: .76rem;
    color: var(--text-muted);
    font-variant-numeric: tabular-nums;
  }
  #context-budget[data-over] { color: var(--warn); font-weight: 600 }
  .budget-wrap { display: flex; align-items: center; gap: .55rem; flex-wrap: wrap }
  .budget-bar {
    width: 4.5rem;
    height: .36rem;

<script>
  const byId = id => document.getElementById(id);
  const status = byId("status");
  const run = byId("run");
  const runVision = byId("run-vision");
  const refresh = byId("refresh");
  const output = byId("output");
  const transcript = byId("transcript");
  const emptyState = byId("empty-state");
  const historyList = byId("history");
  const promptField = byId("prompt");
  const systemField = byId("system-prompt");
  const newChat = byId("new-chat");
  const storageKey = "kgl.demo.conversations.v1";
  const themeKey = "kgl.demo.theme";
  let conversations = [];
  let active = null;
  let newDraft = "";
  let newSystem = "";
  let vision = false;
  let canSend = false;
  let running = false;
  let controller;
  let sessionDeadline;
  let contextLimit;
  const defaultReplyTokens = 768;
  const tokenEncoder = new TextEncoder();
  const keyStorage = "kgl.demo.proxy-key";
  const keyField = byId("key");

  // Theme initialization
  function applyTheme(theme) {
    document.documentElement.dataset.theme = theme;
    byId("theme-toggle").innerHTML = theme === "dark" ? "&#9728;" : "&#9790;";
    byId("theme-toggle").title = theme === "dark" ? "Switch to light mode" : "Switch to dark mode";
  }
  try {
    const savedTheme = localStorage.getItem(themeKey);
    const preferred = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    applyTheme(savedTheme === "dark" || savedTheme === "light" ? savedTheme : preferred);
  } catch {
    applyTheme("light");
  }
  byId("theme-toggle").addEventListener("click", () => {
    const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
    applyTheme(next);
    try { localStorage.setItem(themeKey, next); } catch {}
  });

  function setStatus(text, state = "checking") {
    status.textContent = text;
    status.dataset.state = state;
  }

  try {
    keyField.value = sessionStorage.getItem(keyStorage) || "";
  } catch {
    // A key entered in this tab still works when browser storage is disabled.
  }
  keyField.addEventListener("input", () => {
    try {
      if (keyField.value) sessionStorage.setItem(keyStorage, keyField.value);
      else sessionStorage.removeItem(keyStorage);
    } catch {
      // Keep using the input value for this page.
    }
  });

  function requestKey() {
    keyField.value = "";
    keyField.dispatchEvent(new Event("input"));
    byId("auth").hidden = false;
    canSend = false;
    run.disabled = runVision.disabled = byId("retry").disabled = true;
    keyField.focus();
  }

  function updateSessionTime(seconds) {
    sessionDeadline = Number.isFinite(seconds) && seconds >= 0
      ? performance.now() + seconds * 1000 : undefined;
    renderSessionTime();
  }

  function renderSessionTime() {
    const label = byId("session-time");
    label.hidden = sessionDeadline === undefined;
    if (label.hidden) return;
    const minutes = Math.max(0, Math.ceil((sessionDeadline - performance.now()) / 60000));
    const hours = Math.floor(minutes / 60);
    const rem = minutes % 60;
    const formatted = hours ? `${hours}h ${rem}m` : `${minutes} min`;
    label.textContent = `Session left · ${formatted}`;
    label.title = `Estimated session time left · ${minutes} min`;
    label.toggleAttribute("data-low", minutes <= 30);
  }

  setInterval(renderSessionTime, 15000);

  try {
    const saved = JSON.parse(localStorage.getItem(storageKey));
    if (Array.isArray(saved?.conversations)) {
      conversations = saved.conversations;
      active = conversations.find(chat => chat.id === saved.active) || null;
      newDraft = saved.newDraft ?? "";
      newSystem = typeof saved.newSystem === "string" ? saved.newSystem : "";
    }
  } catch (error) {
    console.warn("Could not load chat history", error);
  }

  function resizePrompt() {
    promptField.style.height = "auto";
    promptField.style.height = Math.min(promptField.scrollHeight, 224) + "px";
  }

  function syncSystemUI() {
    const val = active ? (active.system ?? "") : newSystem;
    systemField.value = val;
    byId("toggle-system").dataset.active = String(Boolean(val.trim()));
  }

  promptField.value = active?.draft ?? (active ? "" : newDraft);
  syncSystemUI();

  const schemaVersion = 1;

  function historyNotice(message) {
    const notice = byId("history-status");
    notice.textContent = message;
    notice.hidden = !message;
  }

  function snapshot() {
    return {
      schema_version: schemaVersion,
      conversations,
      active: active?.id,
      newDraft,
      newSystem
    };
  }

  function saveHistory(data = snapshot()) {
    try {
      localStorage.setItem(storageKey, JSON.stringify(data));
      return true;
    } catch (error) {
      historyNotice(error.name === "QuotaExceededError"
        ? "Browser storage is full. Export your history, then delete an old conversation."
        : "History could not be saved. Export a backup before leaving this page.");
      return false;
    }
  }

  function readBackup(raw) {
    if (raw?.schema_version !== schemaVersion) throw new Error("Unsupported backup version.");
    if (!Array.isArray(raw.conversations)
        || (raw.newDraft !== undefined && typeof raw.newDraft !== "string")
        || (raw.newSystem !== undefined && typeof raw.newSystem !== "string")) {
      throw new Error("Invalid conversation backup.");
    }
    const ids = new Set();
    const chats = raw.conversations.map(chat => {
      if (!chat || typeof chat.id !== "string" || !chat.id || ids.has(chat.id)
          || !Array.isArray(chat.messages) || !chat.messages.length
          || (chat.title !== undefined && typeof chat.title !== "string")
          || (chat.draft !== undefined && typeof chat.draft !== "string")
          || (chat.system !== undefined && typeof chat.system !== "string")) {
        throw new Error("Invalid or duplicate conversation in backup.");
      }
      ids.add(chat.id);
      const messages = chat.messages.map(message => {
        if (!message || !["user", "assistant"].includes(message.role) || typeof message.content !== "string"
            || (message.reasoning !== undefined && typeof message.reasoning !== "string")
            || (message.partial !== undefined && typeof message.partial !== "boolean")) {
          throw new Error("Invalid message in backup.");
        }
        const {role, content, reasoning, usage} = message;
        const clean = {role, content, reasoning};
        if (role === "assistant" && message.partial) clean.partial = true;
        if (Number.isSafeInteger(usage?.prompt_tokens) && Number.isSafeInteger(usage?.completion_tokens)) {
          clean.usage = {prompt_tokens: usage.prompt_tokens, completion_tokens: usage.completion_tokens};
        }
        return clean;
      });
      const entry = {id: chat.id, title: chat.title, draft: chat.draft, messages};
      if (chat.system !== undefined) entry.system = chat.system;
      return entry;
    });
    return {chats, active: raw.active, newDraft: raw.newDraft ?? "", newSystem: raw.newSystem ?? ""};
  }

  function exportHistory() {
    const url = URL.createObjectURL(new Blob([JSON.stringify(snapshot(), null, 2)], {type: "application/json"}));
    const link = document.createElement("a");
    link.href = url;
    link.download = "kgl-conversations.json";
    link.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  function importHistory(raw) {
    const backup = readBackup(raw);
    const existing = new Set(conversations.map(chat => chat.id));
    const added = backup.chats.filter(chat => !existing.has(chat.id));
    const merged = [...conversations, ...added];
    const selection = active?.id ?? backup.active;
    const data = {
      ...snapshot(),
      conversations: merged,
      active: selection,
      newDraft: newDraft || backup.newDraft,
      newSystem: newSystem || backup.newSystem
    };
    if (!saveHistory(data)) return;
    conversations = merged;
    newDraft = data.newDraft;
    newSystem = data.newSystem;
    selectChat(merged.find(chat => chat.id === selection) || null, false);
    historyNotice(`Imported ${added.length} · skipped ${backup.chats.length - added.length} existing.`);
  }

  function copyButton(value, label) {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "copy";
    button.textContent = label;
    let resetTimer;
    button.addEventListener("click", async () => {
      clearTimeout(resetTimer);
      try {
        await navigator.clipboard.writeText(value);
        button.textContent = "Copied";
        resetTimer = setTimeout(() => { button.textContent = label; }, 1800);
      } catch {
        button.textContent = "Copy unavailable. Select the text to copy.";
      }
    });
    return button;
  }

  function inlineMarkdown(parent, raw) {
    let offset = 0;
    for (const match of raw.matchAll(/`([^`\n]+)`|\*\*([^*\n]+)\*\*|~~([^~\n]+)~~|\*([^*\n]+)\*/g)) {
      parent.append(raw.slice(offset, match.index));
      const tag = match[1] ? "code" : match[2] ? "strong" : match[3] ? "del" : "em";
      const node = document.createElement(tag);
      node.textContent = match[1] ?? match[2] ?? match[3] ?? match[4];
      parent.append(node);
      offset = match.index + match[0].length;
    }
    parent.append(raw.slice(offset));
  }

  function splitTableRow(line) {
    const trimmed = line.trim().replace(/^\|/, "").replace(/\|$/, "");
    return trimmed.split("|").map(cell => cell.trim());
  }

  function isTableSeparator(line) {
    return /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/.test(line);
  }

  // Build only known DOM elements. Raw HTML remains text.
  function displayAnswer(raw) {
    const fragment = document.createDocumentFragment();
    const lines = raw.split("\n");
    let code = null;
    let codeLang = "";
    let list;
    let quote = [];
    let prose = [];

    function flushProse() {
      if (!prose.length) return;
      const paragraph = document.createElement("p");
      inlineMarkdown(paragraph, prose.join("\n"));
      fragment.append(paragraph);
      prose = [];
    }
    function flushQuote() {
      if (!quote.length) return;
      const bq = document.createElement("blockquote");
      const p = document.createElement("p");
      inlineMarkdown(p, quote.join("\n"));
      bq.append(p);
      fragment.append(bq);
      quote = [];
    }
    function flushCode() {
      const value = code.join("\n");
      const wrap = document.createElement("div");
      wrap.className = "code-block";
      const head = document.createElement("div");
      head.className = "code-head";
      const langLabel = document.createElement("span");
      langLabel.textContent = codeLang || "code";
      head.append(langLabel, copyButton(value, "Copy code"));
      const pre = document.createElement("pre");
      const node = document.createElement("code");
      node.textContent = value;
      pre.append(node);
      wrap.append(head, pre);
      fragment.append(wrap);
      code = null;
      codeLang = "";
    }

    for (let i = 0; i < lines.length; i++) {
      const line = lines[i];
      if (code !== null) {
        if (/^\s*```\s*$/.test(line)) flushCode();
        else code.push(line);
        continue;
      }

      const fence = line.match(/^\s*```(\S*)/);
      if (fence) {
        flushProse();
        flushQuote();
        list = undefined;
        code = [];
        codeLang = fence[1] || "";
        continue;
      }

      // Markdown table: header line + separator line
      if (line.includes("|") && i + 1 < lines.length && isTableSeparator(lines[i + 1])) {
        flushProse();
        flushQuote();
        list = undefined;
        const wrap = document.createElement("div");
        wrap.className = "table-wrap";
        const table = document.createElement("table");
        const thead = document.createElement("thead");
        const headerRow = document.createElement("tr");
        for (const cell of splitTableRow(line)) {
          const th = document.createElement("th");
          inlineMarkdown(th, cell);
          headerRow.append(th);
        }
        thead.append(headerRow);
        table.append(thead);
        const tbody = document.createElement("tbody");
        i += 2;
        while (i < lines.length && lines[i].includes("|") && lines[i].trim()) {
          const tr = document.createElement("tr");
          for (const cell of splitTableRow(lines[i])) {
            const td = document.createElement("td");
            inlineMarkdown(td, cell);
            tr.append(td);
          }
          tbody.append(tr);
          i++;
        }
        i--;
        table.append(tbody);
        wrap.append(table);
        fragment.append(wrap);
        continue;
      }

      const bq = line.match(/^ {0,3}>\s?(.*)/);
      if (bq) {
        flushProse();
        list = undefined;
        quote.push(bq[1]);
        continue;
      }
      flushQuote();

      const item = line.match(/^ {0,3}(?:([-+*])|(\d+)[.)])\s+(.+)/);
      if (item) {
        flushProse();
        const tag = item[2] ? "ol" : "ul";
        if (!list || list.localName !== tag) {
          list = document.createElement(tag);
          if (item[2]) list.start = Number(item[2]);
          fragment.append(list);
        }
        const li = document.createElement("li");
        const task = !item[2] && item[3].match(/^\[([ xX])\]\s+(.+)/);
        if (task) {
          li.className = "task-item";
          const cb = document.createElement("input");
          cb.type = "checkbox";
          cb.disabled = true;
          cb.checked = task[1].toLowerCase() === "x";
          const span = document.createElement("span");
          inlineMarkdown(span, task[2]);
          li.append(cb, span);
        } else {
          inlineMarkdown(li, item[3]);
        }
        list.append(li);
        continue;
      }
      list = undefined;

      if (/^ {0,3}(?:---+|\*\*\*+|___+)\s*$/.test(line)) {
        flushProse();
        fragment.append(document.createElement("hr"));
        continue;
      }

      const heading = line.match(/^ {0,3}(#{1,6})\s+(.+)/);
      if (heading) {
        flushProse();
        const node = document.createElement("h" + Math.min(6, heading[1].length + 2));
        inlineMarkdown(node, heading[2]);
        fragment.append(node);
      } else if (!line.trim()) {
        flushProse();
      } else {
        prose.push(line);
      }
    }
    if (code !== null) flushCode();
    flushQuote();
    flushProse();
    return fragment;
  }

  function showUsage() {
    const last = active?.messages.at(-1)?.usage;
    const usage = byId("usage");
    usage.hidden = vision;
    usage.textContent = last
      ? "Last request · " + last.prompt_tokens.toLocaleString() + " input · "
        + last.completion_tokens.toLocaleString() + " generated tokens"
      : "";
  }

  function addMessage(role, content = "", reasoning = "", partial = false, live = false) {
    const article = document.createElement("article");
    const head = document.createElement("div");
    head.className = "msg-head";
    const title = document.createElement("h2");
    const text = document.createElement("div");
    article.className = role;
    if (partial) article.dataset.partial = "true";
    title.textContent = role === "user" ? "You" : partial ? "Assistant · Incomplete" : "Assistant";
    head.append(title);
    if (role === "assistant" && content && !live) {
      head.append(copyButton(content, "Copy reply"));
    }
    article.append(head);

    let thoughts;
    if (role === "assistant") {
      const details = document.createElement("details");
      details.className = "reasoning";
      const summary = document.createElement("summary");
      thoughts = document.createElement("p");
      summary.textContent = "Reasoning";
      thoughts.textContent = reasoning;
      details.hidden = !reasoning;
      details.append(summary, thoughts);
      article.append(details);

      text.className = "answer";
      if (content) {
        text.append(displayAnswer(content));
      } else if (live) {
        const indicator = document.createElement("span");
        indicator.className = "thinking-indicator";
        indicator.textContent = "Generating reply…";
        text.append(indicator);
      }
    } else {
      const paragraph = document.createElement("p");
      paragraph.textContent = content;
      text.append(paragraph);
    }
    article.append(text);
    transcript.append(article);
    return {text, thoughts};
  }

  function scrollToReply() {
    transcript.scrollTop = transcript.scrollHeight;
    byId("scroll-bottom").hidden = true;
  }

  function chatTitle(chat) {
    return chat?.title || chat?.messages[0]?.content || "New conversation";
  }

  function renderHistory() {
    const query = byId("history-search").value.trim().toLocaleLowerCase();
    historyList.replaceChildren();
    let shown = 0;
    for (const chat of conversations) {
      if (query && ![chatTitle(chat), ...chat.messages.map(message => message.content)]
        .some(text => text.toLocaleLowerCase().includes(query))) continue;
      shown++;
      const button = document.createElement("button");
      button.type = "button";
      const label = document.createElement("span");
      label.className = "history-title";
      label.textContent = chatTitle(chat);
      const count = document.createElement("span");
      count.className = "history-count";
      count.textContent = String(Math.ceil(chat.messages.length / 2));
      button.append(label, count);
      button.title = label.textContent;
      button.setAttribute("aria-current", String(chat === active));
      button.addEventListener("click", () => selectChat(chat));
      historyList.append(button);
    }
    if (!shown) {
      const empty = document.createElement("p");
      empty.className = "history-empty";
      empty.textContent = query ? "No matching conversations." : "No saved conversations yet.";
      historyList.append(empty);
    }
  }

  function renderTranscript(liveMessage) {
    byId("thread-title").textContent = chatTitle(active);
    byId("rename-chat").hidden = byId("delete-chat").hidden = !active;
    showUsage();
    transcript.replaceChildren();
    const msgs = active?.messages || [];
    emptyState.hidden = vision || msgs.length > 0;
    transcript.hidden = vision || msgs.length === 0;
    let reply;
    for (const message of msgs) {
      const isLive = message === liveMessage;
      const nodes = addMessage(message.role, message.content, message.reasoning,
        message.partial && !isLive, isLive);
      if (isLive) reply = nodes;
    }
    byId("retry").hidden = !msgs.at(-1)?.partial;
    scrollToReply();
    return reply;
  }

  function selectChat(chat, persist = true) {
    active = chat;
    renderHistory();
    renderTranscript();
    if (persist) saveHistory();
    promptField.value = active?.draft ?? (active ? "" : newDraft);
    syncSystemUI();
    resizePrompt();
    renderBudget();
    promptField.focus();
  }

  function setBusy(busy) {
    running = busy;
    run.disabled = runVision.disabled = busy || !canSend;
    refresh.disabled = newChat.disabled = busy;
    byId("retry").disabled = busy || !canSend;
    byId("stop").hidden = !busy || vision;
    byId("stop").disabled = !busy;
    historyList.inert = busy;
    for (const id of ["rename-chat", "delete-chat", "history-search", "import-chat"]) {
      byId(id).disabled = busy;
    }
    promptField.readOnly = busy;
    systemField.readOnly = busy;
    byId("max-tokens").readOnly = busy;
    byId("history-scope").disabled = busy;
  }

  function headers() {
    const key = keyField.value;
    return key ? {"Authorization": "Bearer " + key} : {};
  }

  function showError(error) {
    const message = error instanceof TypeError
      ? "Local proxy unavailable. Check the proxy terminal."
      : error.message;
    const hint = /cuda.*out of memory|outofmemoryerror/i.test(message)
      ? " Try a smaller model or restart the worker with more GPU memory available."
      : "";
    setStatus(message + hint, "error");
  }

  async function check() {
    canSend = false;
    run.disabled = runVision.disabled = byId("retry").disabled = refresh.disabled = true;
    setStatus("Checking model…", "checking");
    try {
      const response = await fetch("/ready", {headers: headers()});
      const data = await response.json();
      const health = data.health || data.last_health;
      updateSessionTime(data.approx_session_remaining_s);
      if (response.status === 401) {
        requestKey();
        throw new Error("Enter your proxy API key, then check the connection.");
      }
      if (data.state === "busy") throw new Error("Worker busy. Check again after the current request.");
      if (health?.status === "error") throw new Error(health.error + " See kgl serve logs.");
      if (data.state === "connection_lost") throw new Error("Kaggle session unavailable. Reconnect kgl and check again.");
      if (data.state === "loading" || data.state === "starting") throw new Error("Loading model. Check again in a moment.");
      if (data.state === "down") throw new Error("Worker unavailable. Check kgl serve status and kgl serve logs.");
      if (!response.ok) {
        const detail = data.error?.message || "Worker identity or device does not match.";
        throw new Error(detail + " Check kgl status and reconnect if the Kaggle session ended.");
      }
      byId("auth").hidden = true;
      vision = health.backend === "python";
      byId("title").textContent = vision ? "Image classification" : "kgl workspace chat";
      const model = byId("model");
      const devices = health.devices?.join(", ") || health.device;
      const context = health.n_ctx || health.requested_context;
      const contextLabel = context
        ? context.toLocaleString() + " ctx" + (health.n_ctx ? "" : " req")
        : "";
      model.title = health.model || "";
      contextLimit = Number.isSafeInteger(context) && context > 1 ? context : undefined;
      const limit = byId("max-tokens");
      if (contextLimit) limit.max = contextLimit - 1;
      else limit.removeAttribute("max");
      model.textContent = [health.model?.split("/").pop(), devices, contextLabel]
        .filter(Boolean).join(" · ");
      model.hidden = false;
      byId("chat").hidden = vision;
      byId("vision").hidden = !vision;
      byId("sidebar-toggle").hidden = vision;
      byId("conversations").hidden = vision;
      byId("generation").hidden = vision;
      byId("thread-head").hidden = vision;
      if (vision) {
        byId("system-bar").hidden = true;
        emptyState.hidden = true;
        transcript.hidden = true;
      }
      byId("usage").hidden = vision;
      byId("panel").hidden = false;
      if (!vision) {
        renderHistory();
        renderTranscript();
      }
      renderBudget();
      setStatus("Ready", "ready");
      canSend = true;
      run.disabled = runVision.disabled = byId("retry").disabled = false;
    } catch (error) {
      if (error instanceof TypeError) updateSessionTime();
      showError(error);
    } finally {
      refresh.disabled = false;
    }
  }

  function readImage(file) {
    if (!file || file.size === 0 || file.size > 350 * 1024) {
      throw new Error("Choose a JPEG or PNG between 1 byte and 350 KiB.");
    }
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result.split(",", 2)[1]);
      reader.onerror = () => reject(new Error("Could not read the selected file."));
      reader.readAsDataURL(file);
    });
  }

  async function readChat(response, {text: output, thoughts}, message) {
    let finishReason;
    let lastSaved = performance.now();
    const reader = response.body.pipeThrough(new TextDecoderStream()).getReader();
    let buffer = "";
    try {
      while (true) {
        const {value, done} = await reader.read();
        if (done) throw new Error("The reply ended early. Check the connection before retrying.");
        buffer += value;
        const lines = buffer.split("\n");
        buffer = lines.pop();
        for (const line of lines) {
          if (!line.startsWith("data:")) continue;
          const text = line.slice(5).trim();
          if (text === "[DONE]") return finishReason;
          const event = JSON.parse(text);
          if (event.error) throw new Error(event.error.message);
          if (Number.isInteger(event.usage?.prompt_tokens) && Number.isInteger(event.usage?.completion_tokens)) message.usage = event.usage;
          const choice = event.choices?.[0];
          const delta = choice?.delta;
          const nearBottom = transcript.scrollHeight - transcript.scrollTop - transcript.clientHeight < 90;
          if (delta?.reasoning_content) {
            thoughts.parentElement.hidden = false;
            message.reasoning += delta.reasoning_content;
            thoughts.textContent = message.reasoning;
          }
          if (delta?.content) {
            message.content += delta.content;
            output.replaceChildren(displayAnswer(message.content));
          }
          finishReason = choice?.finish_reason || finishReason;
          if (performance.now() - lastSaved >= 400) {
            saveHistory();
            lastSaved = performance.now();
          }
          if (nearBottom) scrollToReply();
        }
      }
    } finally {
      await reader.cancel().catch(() => {});
    }
  }

  function estimateMessageTokens(content) {
    const bytes = tokenEncoder.encode(content).length;
    const units = content.match(/\p{L}+|\p{N}{1,3}|[^\s\p{L}\p{N}]/gu)?.length ?? 0;
    return 6 + Math.ceil(Math.max(bytes / 3.5, units * 1.1));
  }

  function chatRequest(retry = false) {
    const previous = active?.messages || [];
    const prompt = promptField.value.trim();
    const systemText = (active ? (active.system ?? "") : newSystem).trim();
    const messages = retry ? previous.slice(0, -1)
      : [...previous, {role: "user", content: prompt}];
    const usable = messages.filter((message, index) =>
      message.content && !message.partial && !messages[index + 1]?.partial);
    const scope = byId("history-scope").value;
    const count = 2 * Number(scope) + (retry || prompt ? 1 : 0);
    const selected = scope === "all" ? usable : usable.slice(Math.max(0, usable.length - count));
    const sent = systemText ? [{role: "system", content: systemText}, ...selected] : selected;
    const limit = byId("max-tokens");
    const replyTokens = limit.value ? limit.valueAsNumber
      : contextLimit && Math.min(defaultReplyTokens, contextLimit - 1);
    const estimate = 64 + sent.reduce((tokens, message) =>
      tokens + estimateMessageTokens(message.content), 0);
    return {messages, sent, replyTokens, estimate};
  }

  function renderBudget() {
    const wrap = byId("budget-wrap");
    const budget = byId("context-budget");
    const fill = byId("budget-fill");
    wrap.hidden = vision || !contextLimit;
    if (wrap.hidden) return;
    const {sent, estimate, replyTokens} = chatRequest();
    const total = estimate + replyTokens;
    const over = total > contextLimit;
    const pct = Math.min(100, Math.round((total / contextLimit) * 100));
    fill.style.width = pct + "%";
    fill.toggleAttribute("data-over", over || pct >= 85);
    budget.textContent = `Sending ${sent.length} msg · ~${estimate.toLocaleString()} in + ${replyTokens.toLocaleString()} max out / ${contextLimit.toLocaleString()} ctx`
      + (over ? " · Over budget: reduce history or max tokens." : "");
    budget.toggleAttribute("data-over", over);
  }

  async function send(retry = false) {
    if (!canSend || running || refresh.disabled) return;
    const prompt = promptField.value.trim();
    if (!vision && !retry && !prompt) {
      showError(new Error("Enter a message."));
      promptField.focus();
      return;
    }
    const previous = active?.messages || [];
    if (retry && !previous.at(-1)?.partial) return;
    const {messages, sent, replyTokens, estimate} = chatRequest(retry);
    if (!vision && replyTokens !== undefined
        && (!Number.isInteger(replyTokens) || replyTokens < 1 || (contextLimit && replyTokens >= contextLimit))) {
      showError(new Error("Choose a reply limit smaller than the context window."));
      return;
    }
    if (!vision && contextLimit && estimate + replyTokens > contextLimit
        && !window.confirm(`Estimated input and reply limit exceed ${contextLimit.toLocaleString()} tokens. Reduce the history or reply limit, or send anyway.`)) return;
    setBusy(true);
    controller = new AbortController();
    byId("result").hidden = true;
    let message;
    try {
      const payload = vision ? {image: await readImage(byId("image").files[0])}
        : {messages: sent.map(({role, content}) => ({role, content})), stream: true, stream_options: {include_usage: true}};
      if (!vision && replyTokens !== undefined) payload.max_tokens = replyTokens;
      setStatus("Running inference…", "busy");
      const response = await fetch(vision ? "/handle" : "/v1/chat/completions", {
        method: "POST", headers: {...headers(), "Content-Type": "application/json"},
        body: JSON.stringify(payload), signal: controller.signal
      });
      if (!response.ok) {
        const {error} = await response.json();
        if (response.status === 401) requestKey();
        const hint = response.status === 503 ? " Check the connection before retrying." : "";
        throw new Error((error?.message || "Inference failed.") + hint);
      }
      if (vision) {
        const {predictions} = await response.json();
        output.textContent = predictions.map(item => item.label + " · " + (item.score * 100).toFixed(1) + "%").join("\n")
          || "No predictions returned.";
        byId("result").hidden = false;
        setStatus("Ready", "ready");
        return;
      }

      if (!active) {
        active = {id: crypto.randomUUID(), system: newSystem || undefined};
        conversations.unshift(active);
        newDraft = "";
      }
      if (!retry) {
        active.draft = "";
        promptField.value = "";
        resizePrompt();
      }
      message = {role: "assistant", content: "", reasoning: "", partial: true};
      active.messages = [...messages, message];
      renderHistory();
      const reply = renderTranscript(message);
      saveHistory();
      const finishReason = await readChat(response, reply, message);
      if (finishReason !== "stop" || !message.content.trim()) {
        throw new Error(finishReason === "length"
          ? "Reply reached the token limit. Adjust the limit before retrying."
          : "Reply is incomplete. Check the connection before retrying.");
      }
      message.partial = false;
      setStatus("Ready", "ready");
    } catch (error) {
      if (controller.signal.aborted) {
        canSend = false;
        setStatus("Reply stopped locally. Check connection to confirm the worker is ready.", "error");
      } else {
        showError(error);
      }
    } finally {
      controller = undefined;
      if (message) {
        saveHistory();
        renderTranscript();
      }
      setBusy(false);
      renderBudget();
    }
  }

  // Events
  byId("form").addEventListener("submit", event => {
    event.preventDefault();
    send();
  });
  promptField.addEventListener("keydown", event => {
    if (event.key === "Enter" && !event.shiftKey && !event.isComposing) {
      event.preventDefault();
      send();
    }
  });
  byId("retry").addEventListener("click", () => send(true));
  byId("stop").addEventListener("click", () => {
    byId("stop").disabled = true;
    controller?.abort();
  });
  window.addEventListener("pagehide", () => {
    if (running && !vision) saveHistory();
  });
  byId("sidebar-toggle").addEventListener("click", () => {
    byId("conversations").hidden = !byId("conversations").hidden;
  });
  byId("toggle-system").addEventListener("click", () => {
    const bar = byId("system-bar");
    bar.hidden = !bar.hidden;
    byId("toggle-system").setAttribute("aria-expanded", String(!bar.hidden));
    if (!bar.hidden) systemField.focus();
  });
  for (const chip of document.querySelectorAll(".chip[data-sys]")) {
    chip.addEventListener("click", () => {
      if (running) return;
      systemField.value = chip.dataset.sys;
      systemField.dispatchEvent(new Event("input"));
      systemField.focus();
    });
  }
  systemField.addEventListener("input", () => {
    if (active) active.system = systemField.value;
    else newSystem = systemField.value;
    syncSystemUI();
    saveHistory();
    renderBudget();
  });
  for (const starter of document.querySelectorAll(".starter[data-prompt]")) {
    starter.addEventListener("click", () => {
      promptField.value = starter.dataset.prompt;
      promptField.dispatchEvent(new Event("input"));
      promptField.focus();
      promptField.setSelectionRange(promptField.value.length, promptField.value.length);
    });
  }
  transcript.addEventListener("scroll", () => {
    const dist = transcript.scrollHeight - transcript.scrollTop - transcript.clientHeight;
    byId("scroll-bottom").hidden = dist < 120;
  });
  byId("scroll-bottom").addEventListener("click", scrollToReply);

  byId("image").addEventListener("change", () => {
    const preview = byId("vision-preview");
    const file = byId("image").files[0];
    if (!file) {
      preview.hidden = true;
      preview.removeAttribute("src");
      return;
    }
    const url = URL.createObjectURL(file);
    preview.onload = () => URL.revokeObjectURL(url);
    preview.src = url;
    preview.hidden = false;
  });

  newChat.addEventListener("click", () => selectChat(null));
  byId("history-search").addEventListener("input", renderHistory);
  byId("rename-chat").addEventListener("click", () => {
    const title = window.prompt("Conversation name", chatTitle(active));
    if (title === null || !title.trim()) return;
    active.title = title.trim();
    renderHistory();
    renderTranscript();
    saveHistory();
  });
  byId("export-chat").addEventListener("click", exportHistory);
  byId("import-chat").addEventListener("click", () => byId("import-file").click());
  byId("import-file").addEventListener("change", async event => {
    const file = event.target.files[0];
    event.target.value = "";
    if (!file) return;
    try {
      const raw = JSON.parse(await file.text());
      if (running) throw new Error("Wait for the current reply before importing.");
      importHistory(raw);
    } catch (error) {
      historyNotice(error.message);
    }
  });
  byId("delete-chat").addEventListener("click", () => {
    if (!active || !window.confirm("Delete this conversation and its draft?")) return;
    const kept = conversations.filter(chat => chat !== active);
    if (!saveHistory({...snapshot(), conversations: kept, active: null})) return;
    conversations = kept;
    selectChat(null, false);
    historyNotice("Conversation deleted.");
  });
  byId("history-scope").addEventListener("change", renderBudget);
  byId("max-tokens").addEventListener("input", renderBudget);
  promptField.addEventListener("input", () => {
    if (active) active.draft = promptField.value;
    else newDraft = promptField.value;
    resizePrompt();
    saveHistory();
    renderBudget();
  });
  refresh.addEventListener("click", check);
  if (conversations.length || newDraft) {
    for (const id of ["conversations", "sidebar-toggle", "thread-head", "chat", "generation", "panel"]) {
      byId(id).hidden = false;
    }
    renderHistory();
    renderTranscript();
    resizePrompt();
  }
  check();
</script>
</html>
