name: Test CLI and wheel
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install 'setuptools>=68' wheel jupyter-server ipykernel
      - run: PYTHONPATH=src python -m unittest discover -s tests -t . -q
      - run: python -m tests.wheel_smoke
